<style>
:root{--violet:#6C4DF6;--coral:#FF6B6B;--sun:#FFC83D;--teal:#19C3A6;--sky:#3DA9FC;--ink:#1E1B3A;--mute:#6B6890;--bg:#F6F4FF;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{padding:10px 18px;border-radius:12px;font-weight:600;color:#fff;background:var(--violet);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.alt{background:var(--coral)}.btn.ghost{background:#ECE8FF;color:var(--violet)}.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}.btn.ok{background:var(--teal)}
input,textarea,select{width:100%;padding:11px 14px;border:2px solid #E4DFFB;border-radius:12px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--violet);outline:0}
label{display:block;text-align:left;font-weight:600;font-size:13px;margin:12px 0 5px}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(135deg,var(--violet),var(--coral) 70%,var(--sun));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.02;font-weight:800}
.hero p{max-width:420px;opacity:.92;font-size:17px;line-height:1.5}
.hero i{position:absolute;border-radius:50%;opacity:.25;background:#fff}
.formbox{display:flex;align-items:center;justify-content:center;padding:32px}
.formbox>div{width:100%;max-width:380px}
.tabs{display:flex;gap:6px;background:#ECE8FF;padding:5px;border-radius:14px;margin:16px 0}
.tabs button{flex:1;padding:9px;border-radius:10px;background:transparent;font-weight:600;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--violet);box-shadow:0 2px 8px #6c4df61f}
/* app */
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--ink);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-size:21px;font-weight:800;padding:0 10px 18px}
.brand b{color:var(--sun)}
nav button{width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:transparent;color:#C9C5EE;font-weight:500;display:flex;gap:10px;align-items:center}
nav button .d{width:10px;height:10px;border-radius:50%}
nav button.on,nav button:hover{background:#2D2A57;color:#fff}
.me{margin-top:auto;padding:14px;background:#2D2A57;border-radius:14px;font-size:13px}
.me b{display:block;font-size:15px}
main{margin-left:240px;padding:30px 34px 60px;max-width:1180px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:30px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{border-radius:20px;padding:20px;color:#fff}
.stat b{font-family:'Bricolage Grotesque';font-size:40px;display:block;line-height:1.1}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px;margin-bottom:24px}
.cc{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:0 4px 18px #6c4df614;min-width:0}
.cc h3{font-size:16px;margin-bottom:12px}
.hb{display:grid;gap:10px}.hbr{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{background:#EFEBFF;border-radius:99px;height:12px;overflow:hidden}.hbt i{display:block;height:100%;border-radius:99px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn svg{width:150px;height:150px;flex:none}
.lg{list-style:none;display:grid;gap:8px;font-size:14px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px}
.col{display:flex;gap:10px;align-items:flex-end;height:180px}.cl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px}.cl i{width:100%;border-radius:8px 8px 0 0}.cl span{color:var(--mute)}
.ln{width:100%;height:auto}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px #6c4df614}
.kc .cover{height:92px;padding:14px;color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;display:flex;align-items:flex-end}
.kc .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.kc p{color:var(--mute);font-size:14px;min-height:38px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pad{padding:18px 20px}
.utool{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:16px 20px;border-bottom:1px solid #F0EDFF}
.utool>div{min-width:130px;flex:1}.utool>div.cari{flex:2;min-width:200px}.utool label{margin-top:0}
.pgbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px}
.pgn{display:flex;gap:6px;flex-wrap:wrap}.pgn button{min-width:38px;padding:8px 10px;border-radius:9px;background:#ECE8FF;color:var(--violet);font-weight:600}
.pgn button.on{background:var(--violet);color:#fff}.pgn button:disabled{opacity:.45;cursor:not-allowed}.pgn span{padding:8px 4px;color:var(--mute)}
.item{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid #F0EDFF}
.item:last-child{border:0}
.item h3{font-size:17px;margin-bottom:3px}
.item small,.muted{color:var(--mute)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#ECE8FF;color:var(--violet)}
.chip.g{background:#D8F7F1;color:#0C8E78}.chip.r{background:#FFE3E3;color:#D13B3B}.chip.y{background:#FFF1CC;color:#9A6B00}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}
.sub{display:flex;gap:6px;margin-bottom:16px}
.sub button{padding:9px 16px;border-radius:12px;background:#fff;font-weight:600;color:var(--mute)}
.sub button.on{background:var(--violet);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:12px 20px;text-align:left;border-bottom:1px solid #F0EDFF}th{color:var(--mute);font-weight:600;font-size:13px}
.item p{white-space:pre-line;line-height:1.55}
.item>div:first-child{min-width:0;flex:1}
.rich{line-height:1.7;margin-top:6px;max-width:74ch}.rich.ql-editor{padding:0!important;height:auto!important;overflow:visible!important}
.rich h1,.rich h2,.rich h3{margin:14px 0 6px}.rich blockquote{border-left:4px solid var(--violet);padding-left:12px;color:var(--mute)}
.embed{margin-top:14px;border-radius:16px;overflow:hidden;aspect-ratio:16/9;max-width:720px;background:#000}.embed iframe{width:100%;height:100%;border:0}
.swal2-popup.rte .swal2-html-container{overflow:visible;text-align:left}
.rte .ql-container{height:230px;font-family:Figtree,sans-serif;font-size:15px;border-radius:0 0 12px 12px}.rte .ql-toolbar{border-radius:12px 12px 0 0}
.note{background:#FFF6D6;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row2{grid-template-columns:1fr}}
.swal2-html-container td{padding:10px 8px;vertical-align:top}
.swal2-popup{font-family:Figtree,sans-serif;border-radius:22px!important}
.swal2-title{font-family:'Bricolage Grotesque'!important}
@media(max-width:860px){#login{grid-template-columns:1fr}.hero{padding:32px}aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{padding:0 8px}.me{display:none}main{margin:0;padding:20px 16px 50px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
